[package]
name = "ews-data-tool"
version = "0.4.0"
description = "EWS Data Tool - wafer sort data exploration and reporting"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ews_data_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
memmap2 = "0.9"
csv = "1.3"
rayon = "1.10"
base64 = "0.22"
encoding_rs = "0.8"
chrono = "0.4"
newtua-lzw-z = "0.1"
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
